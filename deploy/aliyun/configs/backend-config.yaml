# 后端配置文件 - 阿里云环境
# ⚠️ 生产环境配置，敏感信息通过环境变量覆盖

server:
  port: 8080
  mode: release
  read_timeout: 30s
  write_timeout: 600s

mysql:
  host: 114.215.190.52
  port: 3306
  user: root
  password: "${MYSQL_PASSWORD}"
  database: backend_db
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 3600s
  charset: utf8mb4

redis:
  host: 114.215.190.52
  port: 6379
  password: "${REDIS_PASSWORD}"
  db: 0
  pool_size: 100

jwt:
  secret: "${JWT_SECRET}"
  access_token_ttl: 168h
  refresh_token_ttl: 720h
  issuer: backend-server

log:
  level: info
  format: json
  output: file
  file_path: ./logs/app.log
  max_size: 100
  max_backups: 5
  max_age: 30

cors:
  allow_origins:
    - "http://123.57.201.44"
    - "http://123.57.201.44:80"
  allow_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allow_headers:
    - Authorization
    - Content-Type
    - X-Device-ID
  expose_headers:
    - Content-Disposition
  allow_credentials: true
  max_age: 12h

ratelimit:
  rate: 100
  burst: 200

# 文件存储配置
# 注意: MinIO/OSS/COS 的配置已迁移到数据库 system_settings 表，通过管理后台配置
# 此处仅保留本地存储配置和默认驱动设置
storage:
  driver: local        # 默认驱动: local | minio | oss | cos
  local:
    path: ./uploads
    url_prefix: /uploads

crypto:
  aes_key: "${AES_KEY}"

captcha:
  width: 240
  height: 80
  length: 4
  max_skew: 0.7
  dot_count: 80
  secret: "${CAPTCHA_SECRET}"
