# DevKit Nginx Configuration
# 后端 API -> 127.0.0.1:8082
# 前端后台 -> port 80 (/var/www/admin)
# 移动端H5 -> port 8080 (/var/www/mobile)

# 后端 API 代理 (共用)
upstream backend_api {
    server 127.0.0.1:8082;
    keepalive 32;
}

# ===== 端口 80: 前端后台管理系统 =====
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/admin;

    client_max_body_size 200m;

    # 健康检查
    location = /health {
        proxy_pass http://backend_api/health;
        proxy_set_header Host $host;
    }

    # MinIO 反向代理
    location ^~ /minio/ {
        proxy_pass http://10.0.50.108:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location ^~ /api/v1/ws {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
    }

    # API 代理
    location ^~ /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
    }

    # 上传文件静态访问
    location /uploads {
        alias /opt/devkit/uploads;
        autoindex off;
    }

    # 前端 SPA
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

# ===== 端口 8080: 移动端 H5 =====
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /var/www/mobile;

    client_max_body_size 50m;

    # 健康检查
    location = /health {
        proxy_pass http://backend_api/health;
        proxy_set_header Host $host;
    }

    # WebSocket
    location ^~ /api/v1/ws {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
    }

    # API 代理
    location ^~ /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
    }

    # 上传文件
    location /uploads {
        alias /opt/devkit/uploads;
        autoindex off;
    }

    # 前端 SPA
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}