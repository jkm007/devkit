# ============================================================
# DevKit Nginx 配置 - 性能优化版 + 反扫描加固
# mobile.iqihang.top - 移动端 H5 (HTTPS)
# txz.iqihang.top    - 管理后台 (HTTPS)
# ============================================================

server_tokens off;

# 限流 zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

# ============================================================
# 默认 server - 拦截所有非域名访问（IP 直接访问、伪造 Host）
# ============================================================

# HTTP 默认 - 关闭连接
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    error_log off;
    return 444;
}

# HTTPS 默认 - 使用伪证书关闭连接
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/ssl/dummy.pem;
    ssl_certificate_key /etc/nginx/ssl/dummy.key;
    access_log off;
    error_log off;
    ssl_ciphers NULL;
    return 444;
}

# ============================================================
# mobile.iqihang.top - 移动端 H5
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name mobile.iqihang.top;

    access_log /var/log/nginx/mobile-access.log main;
    access_log /var/log/nginx/mobile-access.json.log json_analytics;
    error_log /var/log/nginx/mobile-error.log warn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mobile.iqihang.top;

    access_log /var/log/nginx/mobile-access.log main;
    access_log /var/log/nginx/mobile-access.json.log json_analytics;
    error_log /var/log/nginx/mobile-error.log warn;

    ssl_certificate /etc/nginx/ssl/iqihang.top.pem;
    ssl_certificate_key /etc/nginx/ssl/iqihang.top.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /opt/devkit/frontend-mobile;
    index index.html;

    client_max_body_size 200m;

    # --- 反扫描：拒绝常见漏洞扫描路径 ---
    location ~* ^/(.env|.env.*|.git|wp-admin|wp-login|wp-config\.php|phpMyAdmin|phpmyadmin|\.git/|\.github/|\.gitlab|\.htaccess|\.htpasswd|\.svn|\.DS_Store) {
        deny all;
        access_log off;
        error_log off;
        return 403;
    }

    location ~* ^/.*\.(sql|bak|old|orig|save|swp|swo|dump|sql\.gz|backup)$ {
        deny all;
        access_log off;
        error_log off;
        return 403;
    }

    location ~* ^/(actuator|admin\.php|config\.php|config\.env|console|debug|trace|swagger|api-docs|graphql|nacos|ofbiz|jmx|solr|jenkins|drupal|struts|weblogic|cgi-bin|autodiscover) {
        deny all;
        access_log off;
        error_log off;
        return 403;
    }

    location ^~ /api/ {
        limit_req zone=api_limit burst=100 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
    }

    location ^~ /minio/ {
        proxy_pass http://10.0.50.108:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css)$ {
        gzip_static on;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mp4|webm|mp3|m4a|ogg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        try_files $uri $uri/ /index.html;
    }
}

