host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
    url: http://www.example.com/support
  description: 后端管理服务 API 文档
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Backend Server API
  version: "1.0"
paths:
  /auth/captcha:
    get:
      description: 根据 type 参数生成对应类型的验证码
      parameters:
      - default: numeric
        description: '验证码类型: numeric/slider/puzzle/rotation/point'
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/captcha.CaptchaData'
              type: object
      summary: 获取图形验证码
      tags:
      - 认证
  /auth/change-password:
    put:
      consumes:
      - application/json
      description: 当前用户修改自己的密码
      parameters:
      - description: 修改密码请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 修改密码
      tags:
      - 认证
  /auth/codes:
    get:
      description: 获取当前用户的权限码列表（带 Redis 缓存，10 分钟 TTL）
      produces:
      - application/json
      responses:
        "200":
          description: 权限码列表
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    type: string
                  type: array
              type: object
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取权限码
      tags:
      - 认证
  /auth/devices:
    get:
      description: 获取当前用户所有已登录设备
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.LoginDevice'
                  type: array
              type: object
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取登录设备列表
      tags:
      - 登录设备
  /auth/devices/{id}:
    delete:
      description: 将指定设备踢下线
      parameters:
      - description: 设备 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 踢出指定设备
      tags:
      - 登录设备
  /auth/devices/kick-all:
    delete:
      description: 踢出除当前设备外的所有设备
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties:
                    format: int64
                    type: integer
                  type: object
              type: object
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 踢出所有其他设备
      tags:
      - 登录设备
  /auth/login:
    post:
      consumes:
      - application/json
      description: 用户名密码登录，返回 AccessToken 和用户信息
      parameters:
      - description: 登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.LoginResponse'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: 账号密码错误或账号已禁用
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户登录
      tags:
      - 认证
  /auth/login-by-email:
    post:
      consumes:
      - application/json
      description: 使用邮箱+验证码登录，返回 AccessToken 和用户信息
      parameters:
      - description: 邮箱登录请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.LoginByEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.LoginResponse'
              type: object
        "400":
          description: 参数错误或验证码错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 邮箱验证码登录
      tags:
      - 认证
  /auth/login-by-phone:
    post:
      consumes:
      - application/json
      description: 使用手机号+短信验证码登录，返回 AccessToken 和用户信息
      parameters:
      - description: 手机号登录请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.LoginByPhoneRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.LoginResponse'
              type: object
        "400":
          description: 参数错误或验证码错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 手机号验证码登录
      tags:
      - 认证
  /auth/logout:
    post:
      description: 清除登录状态，将 Token 加入黑名单
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户登出
      tags:
      - 认证
  /auth/oauth/authorize:
    get:
      description: 获取第三方平台的授权页面 URL
      parameters:
      - description: 提供商：wechat/github/google
        in: query
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取第三方授权 URL
      tags:
      - OAuth绑定
  /auth/oauth/bind-url:
    get:
      description: 获取第三方平台的授权页面 URL
      parameters:
      - description: 提供商：wechat/github/google
        in: query
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取第三方授权 URL
      tags:
      - OAuth绑定
  /auth/oauth/bindings:
    get:
      description: 获取当前用户已绑定的第三方账号列表
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/service.OAuthBindingItem'
                  type: array
              type: object
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取第三方绑定列表
      tags:
      - OAuth绑定
  /auth/oauth/callback:
    get:
      description: 第三方平台授权完成后的回调接口，返回 JWT token
      parameters:
      - description: 提供商
        in: query
        name: provider
        required: true
        type: string
      - description: 授权码
        in: query
        name: code
        required: true
        type: string
      - description: 状态参数
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.LoginResponse'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 第三方授权回调
      tags:
      - OAuth绑定
  /auth/oauth/unbind:
    post:
      consumes:
      - application/json
      description: 解绑指定的第三方账号
      parameters:
      - description: 解绑请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.OAuthUnbindRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 解绑第三方账号
      tags:
      - OAuth绑定
  /auth/password-history/check:
    post:
      consumes:
      - application/json
      description: 修改密码前，校验新密码是否与最近 5 次密码重复
      parameters:
      - description: 检查密码请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.CheckPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties:
                    type: boolean
                  type: object
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 检查密码是否重复
      tags:
      - 密码历史
  /auth/permission-version:
    get:
      description: 返回用户当前权限码的 SHA-256 hash，用于前端检测权限是否变更（轮询比对）
      produces:
      - application/json
      responses:
        "200":
          description: 权限版本 hash
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: string
              type: object
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取权限版本
      tags:
      - 认证
  /auth/refresh:
    post:
      description: 使用 Cookie 中的 RefreshToken 获取新的 AccessToken + RefreshToken（Token
        轮换，旧 Token 自动失效）
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.TokenRefreshResponse'
              type: object
        "403":
          description: RefreshToken 无效或已过期
          schema:
            $ref: '#/definitions/response.Response'
      summary: 刷新 AccessToken
      tags:
      - 认证
  /auth/register:
    post:
      consumes:
      - application/json
      description: 新用户注册（需要邮箱验证码）
      parameters:
      - description: 注册请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户注册
      tags:
      - 认证
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: 通过邮箱验证码重置密码
      parameters:
      - description: 重置密码请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 重置密码
      tags:
      - 认证
  /auth/role-applications:
    get:
      description: 获取当前用户的角色申请记录
      parameters:
      - description: 页码，默认 1
        in: query
        minimum: 1
        name: page
        type: integer
      - description: 每页条数，默认 20
        in: query
        maximum: 100
        minimum: 1
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/response.PageData'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/model.RoleApplication'
                        type: array
                    type: object
              type: object
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取我的角色申请列表
      tags:
      - 角色申请
    post:
      consumes:
      - application/json
      description: 用户提交角色申请
      parameters:
      - description: 角色申请请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.RoleApplicationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 创建角色申请
      tags:
      - 角色申请
  /auth/security-logs:
    get:
      description: 当前用户查看自己的安全操作记录
      parameters:
      - description: 页码，默认 1
        in: query
        minimum: 1
        name: page
        type: integer
      - description: 每页条数，默认 20
        in: query
        maximum: 100
        minimum: 1
        name: pageSize
        type: integer
      - description: 事件类型筛选
        in: query
        name: eventType
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/response.PageData'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/model.SecurityLog'
                        type: array
                    type: object
              type: object
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取当前用户的安全日志
      tags:
      - 安全日志
  /auth/send-code:
    post:
      consumes:
      - application/json
      description: 向指定邮箱发送验证码（注册/重置密码）
      parameters:
      - description: 发送请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.SendCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 发送邮箱验证码
      tags:
      - 认证
  /auth/send-sms-code:
    post:
      consumes:
      - application/json
      description: 向指定手机号发送验证码
      parameters:
      - description: 发送请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.SendSMSCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 发送短信验证码
      tags:
      - 认证
  /auth/verify-code:
    post:
      consumes:
      - application/json
      description: 验证用户提交的邮箱验证码是否正确
      parameters:
      - description: 验证请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.VerifyCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 验证邮箱验证码
      tags:
      - 认证
  /auth/wechat/miniapp-login:
    post:
      consumes:
      - application/json
      description: 通过 wx.login() 获取的 code 登录，返回 JWT token
      parameters:
      - description: 登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.MiniAppLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.LoginResponse'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 微信小程序登录
      tags:
      - 微信登录
  /auth/wechat/official-authorize:
    get:
      description: 获取微信公众号网页授权页面 URL
      parameters:
      - description: '授权范围: snsapi_base 或 snsapi_userinfo'
        in: query
        name: scope
        type: string
      produces:
      - application/json
      responses:
        "200":
