        type: string
      permissions:
        items:
          type: string
        type: array
      remark:
        type: string
      status:
        type: integer
    type: object
  service.UpdateSettingsRequest:
    properties:
      settings:
        additionalProperties:
          additionalProperties: true
          type: object
        type: object
    required:
    - settings
    type: object
  service.UpdateUserRequest:
    properties:
      bio:
        type: string
      birthday:
        type: string
      email:
        type: string
      gender:
        type: integer
      groupId:
        type: integer
      name:
        type: string
      nickname:
        type: string
      phone:
        type: string
      remark:
        type: string
      roleIds:
        description: 角色ID列表
        items:
          type: integer
        type: array
      status:
        type: integer
    type: object
  service.UserResponse:
    properties:
      avatar:
        type: string
      bio:
        type: string
      birthday:
        type: string
      createTime:
        type: string
      email:
        type: string
      gender:
        type: integer
      groupId:
        type: integer
      id:
        type: integer
      isReal:
        type: integer
      lastLoginAt:
        type: string
      lastLoginIP:
        type: string
      mustChangePassword:
        type: boolean
      name:
        type: string
      nickname:
        type: string
      passwordChangedAt:
        type: string
      phone:
        type: string
      realName:
        type: string
      registerSource:
        type: string
      remark:
        type: string
      roleIds:
        items:
          type: integer
        type: array
      status:
        type: integer
