  /system/user/list:
    get:
      description: 获取用户列表数据，支持分页和多条件筛选
      parameters:
      - description: 页码，默认 1
        in: query
        minimum: 1
        name: page
        type: integer
      - description: 每页条数，默认 20
        in: query
        maximum: 100
        minimum: 1
        name: pageSize
        type: integer
      - description: 用户名称（模糊搜索）
        in: query
        name: name
        type: string
      - description: 用户 ID（精确匹配）
        in: query
        name: id
        type: string
      - description: 状态：0=禁用, 1=启用
        in: query
        name: status
        type: string
      - description: 分组 ID
        in: query
        name: groupId
        type: string
      - description: 创建时间起始（格式：2006-01-02 15:04:05）
        in: query
        name: startTime
        type: string
      - description: 创建时间结束（格式：2006-01-02 15:04:05）
        in: query
        name: endTime
        type: string
      - description: 备注（模糊搜索）
        in: query
        name: remark
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/response.PageData'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/service.UserResponse'
                        type: array
                    type: object
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取用户列表
      tags:
      - 用户管理
