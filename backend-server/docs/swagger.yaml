definitions:
  model.LoginDevice:
    properties:
      browser:
        type: string
      createdAt:
        type: string
      deviceId:
        type: string
      deviceName:
        type: string
      deviceType:
        type: string
      id:
        type: integer
      ip:
        type: string
      isCurrent:
        type: integer
      lastActiveAt:
        type: string
      location:
        type: string
      os:
        type: string
      userId:
        type: integer
    type: object
  model.RoleApplication:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      reason:
        type: string
      reviewNote:
        type: string
      reviewedAt:
        type: string
      reviewedBy:
        type: integer
      roleId:
        type: integer
      status:
        type: integer
      userId:
        type: integer
    type: object
  model.SecurityLog:
    properties:
      createdAt:
        type: string
      eventDetail:
        type: string
      eventType:
        type: string
      id:
        type: integer
      ip:
        type: string
      status:
        type: integer
      userAgent:
        type: string
      userId:
        type: integer
      username:
        type: string
    type: object
  model.UserPrivacy:
    properties:
      classVisible:
        type: integer
      createdAt:
        type: string
      emailVisible:
        type: integer
      id:
        type: integer
      profileVisible:
        type: integer
      realnameVisible:
        type: integer
      statsVisible:
        type: integer
      userId:
        type: integer
    type: object
  model.UserRealName:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      realName:
        type: string
      rejectReason:
        type: string
      reviewedAt:
        type: string
      reviewedBy:
        type: integer
      status:
        type: integer
      submittedAt:
        type: string
      userId:
        type: integer
    type: object
  response.PageData:
    properties:
      items: {}
      total:
        type: integer
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      error: {}
      message:
        type: string
    type: object
  service.ChangePasswordRequest:
    properties:
      confirmPassword:
        type: string
      newPassword:
        type: string
      oldPassword:
        type: string
    required:
    - confirmPassword
    - newPassword
    - oldPassword
    type: object
  service.CheckPasswordRequest:
    properties:
      newPassword:
        type: string
    required:
    - newPassword
    type: object
  service.CreateGroupRequest:
    properties:
      name:
        type: string
      pid:
        type: integer
      remark:
        type: string
      roleIds:
        description: 角色ID列表
        items:
          type: integer
        type: array
      status:
        type: integer
    required:
    - name
    - status
    type: object
  service.CreateMenuRequest:
    properties:
      authCode:
        type: string
      component:
        type: string
      meta: {}
      name:
        type: string
      path:
        type: string
      pid:
        type: integer
      status:
        type: integer
      type:
        type: string
    required:
    - name
    - status
    - type
    type: object
  service.CreateRoleRequest:
    properties:
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
      remark:
        type: string
      status:
        type: integer
    required:
    - name
    - status
    type: object
  service.CreateUserRequest:
    properties:
      bio:
        type: string
      birthday:
        type: string
      email:
        type: string
      gender:
        type: integer
      groupId:
        type: integer
      name:
        type: string
      nickname:
        type: string
      password:
        type: string
      phone:
        type: string
      remark:
        type: string
      roleIds:
        description: 角色ID列表
        items:
          type: integer
        type: array
      status:
        type: integer
    required:
    - name
    - status
    type: object
  service.GroupTreeNode:
    properties:
      children:
        items:
          $ref: '#/definitions/service.GroupTreeNode'
        type: array
      createTime:
        type: string
      id:
        type: integer
      name:
        type: string
      pid:
        type: integer
      remark:
        type: string
      roleIds:
        items:
          type: integer
        type: array
      status:
        type: integer
    type: object
  service.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  service.LoginResponse:
    properties:
      accessToken:
        type: string
      avatar:
        type: string
      bio:
        type: string
      birthday:
        type: string
      email:
        type: string
      gender:
        type: integer
      homePath:
        type: string
      id:
        type: integer
      nickname:
        type: string
      phone:
        type: string
      realName:
        type: string
      roles:
        items:
          type: string
        type: array
      username:
        type: string
    type: object
  service.MenuItem:
    properties:
      authCode:
        type: string
      children:
        items:
          $ref: '#/definitions/service.MenuItem'
        type: array
      component: {}
      createTime:
        type: string
      icon:
        type: string
      id:
        type: integer
      meta: {}
      name:
        type: string
      path:
        type: string
      pid:
        type: integer
      redirect:
        type: string
      status:
        type: integer
      type:
        type: string
    type: object
  service.OAuthBindingItem:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      provider:
        type: string
      providerAvatar:
        type: string
      providerUsername:
        type: string
    type: object
  service.OAuthUnbindRequest:
    properties:
      provider:
        type: string
    required:
    - provider
    type: object
  service.PrivacyRequest:
    properties:
      classVisible:
        type: integer
      emailVisible:
        type: integer
      profileVisible:
        type: integer
      realnameVisible:
        type: integer
      statsVisible:
        type: integer
    type: object
  service.RealNameRejectRequest:
    properties:
      reason:
        type: string
    required:
    - reason
    type: object
  service.RealNameStatusResponse:
    properties:
      idCard:
        type: string
      realName:
        type: string
      rejectReason:
        type: string
      reviewedAt:
        type: string
      status:
        type: integer
      submittedAt:
        type: string
    type: object
  service.RealNameSubmitRequest:
    properties:
      idCard:
        type: string
      realName:
        type: string
    required:
    - idCard
    - realName
    type: object
  service.RoleApplicationRequest:
    properties:
      reason:
        type: string
      roleId:
        type: integer
    required:
    - roleId
    type: object
  service.RoleApplicationReviewRequest:
    properties:
      note:
        type: string
    type: object
  service.RoleResponse:
    properties:
      createTime:
        type: string
      id:
        type: integer
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
      remark:
        type: string
      status:
        type: integer
    type: object
  service.SettingGroupUpdateRequest:
    properties:
      settings:
        additionalProperties: true
        type: object
    required:
    - settings
    type: object
  service.SettingItem:
    properties:
      isPublic:
        type: boolean
      isSensitive:
        type: boolean
      key:
        type: string
      label:
        type: string
      options: {}
      sort:
        type: integer
      tip:
        type: string
      type:
        type: string
      value: {}
    type: object
  service.TestEmailRequest:
    properties:
      to:
        type: string
    required:
    - to
    type: object
  service.TestSMSRequest:
    properties:
      phone:
        type: string
    required:
    - phone
    type: object
  service.TokenRefreshResponse:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
    type: object
  service.UpdateGroupRequest:
    properties:
      name:
        type: string
      remark:
        type: string
      roleIds:
        description: 角色ID列表
        items:
          type: integer
        type: array
      status:
        type: integer
    type: object
  service.UpdateMenuRequest:
    properties:
      authCode:
        type: string
      component:
        type: string
      meta: {}
      name:
        type: string
      path:
        type: string
      pid:
        type: integer
      status:
        type: integer
      type:
        type: string
    type: object
  service.UpdateProfileRequest:
    properties:
      bio:
        type: string
      birthday:
        type: string
      email:
        type: string
      gender:
        type: integer
      nickname:
        type: string
      phone:
        type: string
    type: object
  service.UpdateResult:
    properties:
      restartItems:
        items:
          type: string
        type: array
      restartRequired:
        type: boolean
      updated:
        type: integer
    type: object
  service.UpdateRoleRequest:
    properties:
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
      remark:
        type: string
      status:
        type: integer
    type: object
  service.UpdateSettingsRequest:
    properties:
      settings:
        additionalProperties:
          additionalProperties: true
          type: object
        type: object
    required:
    - settings
    type: object
  service.UpdateUserRequest:
    properties:
      bio:
        type: string
      birthday:
        type: string
      email:
        type: string
      gender:
        type: integer
      groupId:
        type: integer
      name:
        type: string
      nickname:
        type: string
      phone:
        type: string
      remark:
        type: string
      roleIds:
        description: 角色ID列表
        items:
          type: integer
        type: array
      status:
        type: integer
    type: object
  service.UserResponse:
    properties:
      avatar:
        type: string
      bio:
        type: string
      birthday:
        type: string
      createTime:
        type: string
      email:
        type: string
      gender:
        type: integer
      groupId:
        type: integer
      id:
        type: integer
      isReal:
        type: integer
      lastLoginAt:
        type: string
      lastLoginIP:
        type: string
      name:
        type: string
      nickname:
        type: string
      passwordChangedAt:
        type: string
      phone:
        type: string
      realName:
        type: string
      registerSource:
        type: string
      remark:
        type: string
      roleIds:
        items:
          type: integer
        type: array
      status:
        type: integer
    type: object
info:
  contact: {}
paths:
  /auth/change-password:
    put:
      consumes:
      - application/json
      description: 当前用户修改自己的密码
      parameters:
      - description: 修改密码请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 修改密码
      tags:
      - 认证
  /auth/codes:
    get:
      description: 获取当前用户的权限码列表（带 Redis 缓存，10 分钟 TTL）
      produces:
      - application/json
      responses:
        "200":
          description: 权限码列表
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    type: string
                  type: array
              type: object
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取权限码
      tags:
      - 认证
  /auth/devices:
    get:
      description: 获取当前用户所有已登录设备
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.LoginDevice'
                  type: array
              type: object
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取登录设备列表
      tags:
      - 登录设备
  /auth/devices/{id}:
    delete:
      description: 将指定设备踢下线
      parameters:
      - description: 设备 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 踢出指定设备
      tags:
      - 登录设备
  /auth/devices/all:
    delete:
      description: 踢出除当前设备外的所有设备
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties:
                    format: int64
                    type: integer
                  type: object
              type: object
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 踢出所有其他设备
      tags:
      - 登录设备
  /auth/login:
    post:
      consumes:
      - application/json
      description: 用户名密码登录，返回 AccessToken 和用户信息
      parameters:
      - description: 登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.LoginResponse'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: 账号密码错误或账号已禁用
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户登录
      tags:
      - 认证
  /auth/logout:
    post:
      description: 清除登录状态，删除 Cookie 中的 Token
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户登出
      tags:
      - 认证
  /auth/oauth/bind-url:
    get:
      description: 获取第三方平台的授权页面 URL
      parameters:
      - description: 提供商：wechat/github/google
        in: query
        name: provider
        required: true
        type: string
      - description: 授权完成后的回调地址
        in: query
        name: redirectUri
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取第三方授权 URL
      tags:
      - OAuth绑定
  /auth/oauth/bindings:
    get:
      description: 获取当前用户已绑定的第三方账号列表
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/service.OAuthBindingItem'
                  type: array
              type: object
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取第三方绑定列表
      tags:
      - OAuth绑定
  /auth/oauth/callback:
    get:
      description: 第三方平台授权完成后的回调接口
      parameters:
      - description: 提供商
        in: query
        name: provider
        required: true
        type: string
      - description: 授权码
        in: query
        name: code
        required: true
        type: string
      - description: 状态参数
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 第三方授权回调
      tags:
      - OAuth绑定
  /auth/oauth/unbind:
    post:
      consumes:
      - application/json
      description: 解绑指定的第三方账号
      parameters:
      - description: 解绑请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.OAuthUnbindRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 解绑第三方账号
      tags:
      - OAuth绑定
  /auth/password-history/check:
    post:
      consumes:
      - application/json
      description: 修改密码前，校验新密码是否与最近 5 次密码重复
      parameters:
      - description: 检查密码请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.CheckPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties:
                    type: boolean
                  type: object
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 检查密码是否重复
      tags:
      - 密码历史
  /auth/permission-version:
    get:
      description: 返回用户当前权限码的 MD5 hash，用于前端检测权限是否变更（轮询比对）
      produces:
      - application/json
      responses:
        "200":
          description: 权限版本 hash
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: string
              type: object
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取权限版本
      tags:
      - 认证
  /auth/refresh:
    post:
      description: 使用 Cookie 中的 RefreshToken 获取新的 AccessToken + RefreshToken（Token
        轮换，旧 Token 自动失效）
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.TokenRefreshResponse'
              type: object
        "403":
          description: RefreshToken 无效或已过期
          schema:
            $ref: '#/definitions/response.Response'
      summary: 刷新 AccessToken
      tags:
      - 认证
  /auth/role-applications:
    get:
      description: 获取当前用户的角色申请记录
      parameters:
      - description: 页码，默认 1
        in: query
        minimum: 1
        name: page
        type: integer
      - description: 每页条数，默认 20
        in: query
        maximum: 100
        minimum: 1
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/response.PageData'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/model.RoleApplication'
                        type: array
                    type: object
              type: object
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取我的角色申请列表
      tags:
      - 角色申请
    post:
      consumes:
      - application/json
      description: 用户提交角色申请
      parameters:
      - description: 角色申请请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.RoleApplicationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 创建角色申请
      tags:
      - 角色申请
  /auth/security-logs:
    get:
      description: 当前用户查看自己的安全操作记录
      parameters:
      - description: 页码，默认 1
        in: query
        minimum: 1
        name: page
        type: integer
      - description: 每页条数，默认 20
        in: query
        maximum: 100
        minimum: 1
        name: pageSize
        type: integer
      - description: 事件类型筛选
        in: query
        name: eventType
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
