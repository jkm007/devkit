# 后端服务配置

server:
  port: 8080
  mode: debug          # debug | release | test
  read_timeout: 10s
  write_timeout: 10s

# MySQL 配置
mysql:
  host: 10.0.50.108
  port: 3306
  user: root
  password: "root123456"
  database: backend_db
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 3600s
  charset: utf8mb4

# Redis 配置
redis:
  host: 10.0.50.108
  port: 6379
  password: "redis123456"
  db: 0
  pool_size: 100

# JWT 配置
jwt:
  secret: "your-jwt-secret-key-change-in-production"
  access_token_ttl: 168h    # 7 天
  refresh_token_ttl: 720h   # 30 天
  issuer: backend-server

# 日志配置
log:
  level: info          # debug | info | warn | error
  format: json         # json | console
  output: stdout       # stdout | file
  file_path: ./logs/app.log
  max_size: 100        # MB
  max_backups: 5
  max_age: 30          # 天

# CORS 配置
cors:
  allow_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
    - "http://localhost:5666"
    - "http://localhost:5667"
    - "http://10.0.50.207:5666"
    - "http://10.0.50.207:5667"
  allow_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allow_headers:
    - Authorization
    - Content-Type
    - X-Device-ID
  expose_headers:
    - Content-Disposition
  allow_credentials: true
  max_age: 12h

# 限流配置
ratelimit:
  rate: 100            # 每秒请求数
  burst: 200           # 突发容量

# 文件存储配置
storage:
  driver: minio        # local | minio | oss | cos
  local:
    path: ./uploads
    url_prefix: /uploads
  minio:
    endpoint: 10.0.50.108:9000
    access_key: minioadmin
    secret_key: minioadmin123
    bucket: backend
    use_ssl: false
  oss:
    endpoint: oss-cn-hangzhou.aliyuncs.com
    access_key_id: ""
    access_key_secret: ""
    bucket: backend-bucket
    cdn_domain: cdn.example.com
  cos:
    region: ap-guangzhou
    secret_id: ""
    secret_key: ""
    bucket: backend-1250000000
    cdn_domain: cdn.example.com

# CDN 配置
cdn:
  domain: cdn.example.com
  image_style_separator: "x"

# ClamAV 病毒扫描
clamav:
  enabled: false
  socket: /var/run/clamav/clamd.ctl
  timeout: 30s

# AES 加密配置
crypto:
  aes_key: "your-aes-key-32bytes-long!!"  # 32 字节，AES-256

# 图形验证码
captcha:
  width: 240
  height: 80
  length: 4
  max_skew: 0.7
  dot_count: 80
