# 后端服务配置
# ⚠️ 安全提示：所有敏感配置应通过环境变量覆盖，不要将真实密钥提交到版本控制
# 环境变量命名规则：用下划线连接，如 mysql.password → MYSQL_PASSWORD

server:
  port: 8080
  mode: release        # debug | release | test
  read_timeout: 30s
  write_timeout: 600s  # 大文件合并需要较长时间（10分钟）

# MySQL 配置
mysql:
  host: 114.215.190.52
  port: 3306
  user: root
  password: "root123456"
  database: backend_db
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 3600s # 连接最大存活时间，Go duration 格式（如 3600s = 1小时）
  charset: utf8mb4

# Redis 配置
redis:
  host: 114.215.190.52
  port: 6379
  password: "redis123456"
  db: 0
  pool_size: 100

# JWT 配置
jwt:
  secret: "${JWT_SECRET:changeme-generate-a-random-64-byte-string}"
  access_token_ttl: 168h    # 7 天
  refresh_token_ttl: 720h   # 30 天
  issuer: backend-server

# 日志配置
log:
  level: info          # debug | info | warn | error
  format: json         # json | console
  output: stdout       # stdout | file
  file_path: ./logs/app.log
  max_size: 100        # MB
  max_backups: 5
  max_age: 30          # 天

# CORS 配置
# 注意：allow_credentials=true 时，allow_origins 禁止使用 "*"，必须指定明确域名
# 生产环境应通过环境变量 CORS_ALLOW_ORIGINS 覆盖为真实域名
cors:
  allow_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
    - "http://localhost:5666"
    - "http://localhost:5667"
    - "http://10.0.50.207:5666"
    - "http://10.0.50.207:5173"  # 移动端H5开发服务器
    - "http://10.0.50.207:5174"  # 移动端H5备用端口
    - "http://123.57.201.44"     # 移动端H5生产环境(IP)
    - "http://123.57.201.44:8081" # 管理后台生产环境(IP)
    - "https://mobile.iqihang.top"   # 移动端H5正式域名
    - "https://txz.iqihang.top"      # 管理后台正式域名
  allow_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allow_headers:
    - Authorization
    - Content-Type
    - X-Device-ID
    - X-Client-Type
    - X-Refresh-Token
    - X-App-Version
    - X-System-Version
    - X-Device-Model
    - X-Platform
    - X-Channel
    - X-Mobile-Token-Mode
    - X-Captcha-Id
    - X-Captcha-Code
    - X-Captcha-Start-Time
    - X-CSRF-Token
  expose_headers:
    - Content-Disposition
  allow_credentials: true
  max_age: 12h

# 限流配置
ratelimit:
  rate: 100            # 每秒请求数
  burst: 200           # 突发容量

# 文件存储配置
# 注意: MinIO/OSS/COS 的配置已迁移到数据库 system_settings 表，通过管理后台配置
# 此处仅保留本地存储配置和默认驱动设置
storage:
  driver: local        # 默认驱动: local | minio | oss | cos
  local:
    path: ./uploads
    url_prefix: /uploads

# ClamAV 病毒扫描
clamav:
  enabled: false
  socket: /var/run/clamav/clamd.ctl
  timeout: 30s

# AES 加密配置（用于身份证号等敏感数据加密）
crypto:
  aes_key: "${AES_KEY:changeme-generate-a-random-32-byte-string}"  # 32 字节，AES-256

# 验证码加密密钥（AES-GCM，32 字节）
captcha:
  width: 240
  height: 80
  length: 4
  max_skew: 0.7
  dot_count: 80
  secret: "${CAPTCHA_SECRET:changeme-generate-a-random-32-byte-string}"

# 微信小程序配置
# AppSecret 可通过环境变量 WECHAT_MINI_APP_SECRET 覆盖
wechat:
  mini_program:
    app_id: "wxc7e0745dc22733bf"
    app_secret: "${WECHAT_MINI_APP_SECRET:c932bdd8e816065140f5ca39ccc5ff5a}"
